---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-server
  namespace: jellyfin
spec:
  releaseName: jellyfin-server
  chart:
    spec:
      chart: jellyfin
      version: 2.3.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin-helm
  interval: 2m
  values:
    podAnnotations:
      k8s.v1.cni.cncf.io/networks: kube-system/macvlan-eno1

    runtimeClassName: nvidia
    securityContext:
      privileged: true  # seems necessary to allow dlopen'ing libcuda.so.1?
    resources:
      limits:
        nvidia.com/gpu: 1
    deploymentStrategy:
      type: Recreate  # delete old pods first to release gpu resources

    jellyfin:
      env:
        - name: JELLYFIN_HOSTWEBCLIENT
          value: "true"  # TODO: serve jellyfin-vue frontend too?
        - name: TZ
          value: "Europe/Copenhagen"
        - name: JELLYFIN_DATA_DIR
          value: "/jf-data"
        - name: JELLYFIN_CONFIG_DIR
          value: "/jf-config"
        - name: JELLYFIN_CACHE_DIR
          value: "/jf-cache"
        - name: JELLYFIN_LOG_DIR
          value: "/jf-log"
        - name: NVIDIA_DRIVER_CAPABILITIES  # necessary for enabling NVENC transcoding
          value: "all"
        - name: NVIDIA_VISIBLE_DEVICES  # necessary for enabling NVENC transcoding
          value: "all"

    service:
      port: 8096

    # TODO: healthchecks? https://jellyfin.org/docs/general/networking/monitoring/

    persistence:
      config: # /config
        enabled: false
      media: # /media
        enabled: false
      cache: # /cache
        enabled: false

    volumes:
      - name: movies
        nfs:
          server: "10.0.0.3"
          path: "/mnt/pool0/multimedia/clean"
          readOnly: true
      - name: data-dir
        persistentVolumeClaim:
          claimName: jellyfin-data-dir
      - name: config-dir
        persistentVolumeClaim:
          claimName: jellyfin-config-dir
      - name: cache-dir
        emptyDir: {}
      - name: log-dir
        emptyDir: {}

      - name: etc-opencl-vendors
        configMap:
          name: etc-opencl-vendors

    volumeMounts:
      - name: movies
        mountPath: "/movies"

      - name: data-dir
        mountPath: "/jf-data"
      - name: config-dir
        mountPath: "/jf-config"
      - name: cache-dir
        mountPath: "/jf-cache"
      - name: log-dir
        mountPath: "/jf-log"

      - name: etc-opencl-vendors
        mountPath: "/etc/OpenCL/vendors/nvidia.icd"
        subPath: nvidia.icd

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etc-opencl-vendors
  namespace: jellyfin
data:
  nvidia.icd: libnvidia-opencl.so.1

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-server
  namespace: jellyfin
  annotations:
    external-dns.alpha.kubernetes.io/target: ingress.k8s.thaibert.com
spec:
  entryPoints:
    - intweb
    - intwebsecure
  routes:
    - match: "Host(`jellyfin.k8s.thaibert.com`)"
      kind: Rule
      services:
        - name: jellyfin-server
          port: 8096

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin-helm
  namespace: jellyfin
spec:
  interval: 30m
  url: https://jellyfin.github.io/jellyfin-helm

